# Node and Bun execute the same suites, including real MCP stdio retrieval for every
# supported harness shape. Keep both desktop platforms on identical acceptance.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: bun test
        shell: bash
        run: HOME="$(mktemp -d)" bun test
      - name: node test/run.mjs
        shell: bash
        run: HOME="$(mktemp -d)" node test/run.mjs
