<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="head">
    <h1 data-t="title">Compression</h1>
    <p class="lede" data-t="subtitle"></p>
    <div class="segs" id="presets"></div>
    <p class="hint" id="presetHint"></p>
  </header>

  <p class="message" id="message" hidden></p>
  <section id="meter"></section>

  <h2><span data-t="strategies">Strategies</span><span id="strategyCount" class="sec-count"></span></h2>
  <div id="rows" class="list"></div>

  <details class="fold" id="labFold">
    <summary><span>试压实验室</span><span class="muted">单个策略 · 本地运行</span></summary>
    <div class="lab-controls">
      <select id="labStrategy" aria-label="试压策略"></select>
      <button id="runLab" class="action" type="button">运行试压</button>
    </div>
    <textarea id="labInput" rows="7" spellcheck="false"></textarea>
    <p class="hint">使用网关同一份引擎和当前策略参数，不调用模型，不保存试压文本。</p>
    <p id="labStatus" class="hint" aria-live="polite"></p>
    <div id="labResult"></div>
  </details>

  <details class="fold" id="captureFold">
    <summary><span>真实压缩前后</span><span class="muted">最近 50 次 · 本地保存</span><button type="button" class="link" id="clearCaptures">清空</button></summary>
    <p class="hint">默认保留最近 50 次完整前后对话，单份存储上限 2 MB；超出时保留统计并标注“仅摘要”。点击一条后，在下一次网关请求时载入。</p>
    <div id="captures" class="capture-list"></div>
    <p id="captureStatus" class="hint"></p>
    <details id="captureDiff" class="diff-fold"><summary>查看完整前后差异</summary><div id="captureDetail"></div></details>
  </details>

  <details class="fold" id="recentFold">
    <summary>
      <span data-t="recent">Recent</span>
      <span id="recentSummary" class="muted"></span>
      <button type="button" class="link" id="recentMore" data-t="showAll">Show all</button>
    </summary>
    <div id="recent"></div>
  </details>

  <details class="fold" id="advanced">
    <summary><span data-t="advanced">Advanced</span></summary>
    <div class="advanced-grid">
      <div class="adv">
        <div class="fh">
          <label for="budget" data-t="budget">Time budget</label>
          <span class="fhint" data-t="budgetHint"></span>
        </div>
        <input id="budget" type="number" class="num-in" min="50" max="10000" step="10">
      </div>
      <div class="adv">
        <div class="fh">
          <label for="preserveSystem" data-t="preserveSystem">System prompt</label>
          <span class="fhint" data-t="preserveHint"></span>
        </div>
        <button id="preserveSystem" class="sw" type="button" role="switch" aria-checked="true"></button>
      </div>
      <div class="adv">
        <div class="fh">
          <label for="lastTurns" data-t="lastTurns">Last turns</label>
        </div>
        <input id="lastTurns" type="number" class="num-in" min="0" max="20">
      </div>
      <div class="adv">
        <div class="fh"><span data-t="lastWrite">Last write</span></div>
        <span id="lastWrite" class="muted">—</span>
      </div>
    </div>
  </details>

  <script src="_magpie/bridge.js"></script>
  <script src="engines.js"></script>
  <script src="view.js"></script>
  <script src="ui.js"></script>
  <script src="lab-engine.bundle.js"></script>
  <script src="audit.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
