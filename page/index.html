<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ═══ 视图容器 ═══ -->
  <div class="view-container" id="viewContainer">

    <!-- ═══ 主面板视图 ═══ -->
    <div class="view view-main" id="viewMain">
      <header class="head">
        <h1>压缩</h1>
        <p class="lede">网关请求压缩 · 本地引擎 · 不耗 token</p>
        <div class="main-head">
          <div class="segs" id="presets"></div>
          <div class="head-actions">
            <button type="button" class="icon-btn" id="btnCustom" title="自定义策略">
              <span class="icon">⚙</span>
            </button>
            <button type="button" class="icon-btn" id="btnLab" title="试压实验室">
              <span class="icon">⚗</span>
            </button>
          </div>
        </div>
        <p class="hint" id="presetHint"></p>
      </header>

      <p class="message" id="message" hidden></p>
      <section id="meter"></section>

      <!-- 已处理会话列表 -->
      <section class="session-section">
        <h3 class="section-title">已处理会话</h3>
        <div class="session-list" id="sessionList"></div>
        <p class="hint" id="sessionHint">暂无记录。发一条消息触发网关请求后，这里会显示压缩前后的快照。</p>
      </section>
    </div>

    <!-- ═══ 自定义策略视图 ═══ -->
    <div class="view view-custom" id="viewCustom" hidden>
      <header class="view-head">
        <button type="button" class="back-btn" id="backFromCustom">
          <span class="icon">‹</span> 返回
        </button>
        <h2 class="view-title">自定义策略</h2>
        <button type="button" class="icon-btn" id="btnLabFromCustom" title="试压实验室">
          <span class="icon">⚗</span>
        </button>
      </header>

      <div class="strategy-list" id="rows"></div>

      <!-- 高级设置 -->
      <details class="fold" id="advanced">
        <summary class="fold-summary">
          <span>高级设置</span>
          <span class="chev">›</span>
        </summary>
        <div class="fold-body">
          <div class="fields">
            <div class="field">
              <div class="fh">
                <div class="fname">压缩预算（毫秒）</div>
                <span class="fhint">单次请求允许的最大压缩耗时</span>
              </div>
              <div class="fctl">
                <input id="budget" type="number" class="num-in" min="50" max="10000" step="10">
              </div>
            </div>
            <div class="field">
              <div class="fh">
                <div class="fname">保留系统消息</div>
                <span class="fhint">系统提示词不参与压缩</span>
              </div>
              <div class="fctl">
                <button id="preserveSystem" class="sw" type="button" role="switch" aria-checked="true"></button>
              </div>
            </div>
            <div class="field">
              <div class="fh">
                <div class="fname">保留最近轮数</div>
                <span class="fhint">最近 N 轮对话不参与压缩</span>
              </div>
              <div class="fctl">
                <input id="lastTurns" type="number" class="num-in" min="0" max="50" step="1">
              </div>
            </div>
          </div>
        </div>
      </details>
    </div>

    <!-- ═══ 实验室视图 ═══ -->
    <div class="view view-lab" id="viewLab" hidden>
      <header class="view-head">
        <button type="button" class="back-btn" id="backFromLab">
          <span class="icon">‹</span> 返回
        </button>
        <h2 class="view-title">试压实验室</h2>
        <div class="lab-badge">本地运行 · 不耗 token</div>
      </header>

      <div class="lab-container">
        <div class="lab-input-panel">
          <div class="lab-panel-head">
            <span class="lab-panel-title">输入</span>
          </div>
          <div class="lab-panel-body">
            <label class="lab-field">
              <span class="lab-label">选择策略</span>
              <select id="labStrategy" class="lab-select"></select>
            </label>
            <label class="lab-field">
              <span class="lab-label">输入原文</span>
              <textarea id="labInput" class="lab-textarea" rows="12" placeholder="粘贴一段对话或文本…"></textarea>
            </label>
            <button id="runLab" class="lab-run-btn" type="button">
              <span class="icon">▶</span> 运行试压
            </button>
            <p id="labStatus" class="lab-status"></p>
          </div>
        </div>

        <div class="lab-result-panel" id="labResult">
          <div class="lab-empty-state">
            <span class="lab-empty-icon">⚗</span>
            <p class="lab-empty-text">运行试压后<br>这里显示压缩前后的对比</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══ 差异对比弹窗 ═══ -->
  <div class="diff-modal" id="diffModal" hidden>
    <div class="diff-modal-backdrop" id="diffBackdrop"></div>
    <div class="diff-modal-content">
      <header class="diff-modal-head">
        <div class="diff-modal-info">
          <h3 class="diff-modal-title" id="diffTitle">压缩前后差异</h3>
          <div class="diff-modal-meta" id="diffMeta"></div>
        </div>
        <button type="button" class="icon-btn close-btn" id="diffClose">
          <span class="icon">✕</span>
        </button>
      </header>
      <div class="diff-modal-body" id="diffBody"></div>
    </div>
  </div>

  <script src="_magpie/bridge.js"></script>
  <script src="engines.js"></script>
  <script src="view.js"></script>
  <script src="ui.js"></script>
  <script src="lab-engine.bundle.js"></script>
  <script src="audit.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
